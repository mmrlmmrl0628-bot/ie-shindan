<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>第56話 ホワイトボード風ショート動画</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/noto900.css">
<style>
  html,body{margin:0;background:#eceae4;}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#fff;
    box-shadow:inset 0 0 140px rgba(0,0,0,.07);font-family:'Noto Sans JP',sans-serif;font-weight:900;transform-origin:0 0;}
  .scene{position:absolute;inset:0;display:none}
  .scene svg{position:absolute;inset:0;width:1080px;height:1920px}
  .t{position:absolute;white-space:nowrap;line-height:1.3;transform:translateX(-50%);
     -webkit-text-stroke:1.5px currentColor;letter-spacing:.02em}
  .h{background:linear-gradient(transparent 60%,var(--hc,#ffe066) 60%,var(--hc,#ffe066) 94%,transparent 94%) no-repeat;
     background-size:calc(var(--p,0)*100%) 100%;padding:0 .08em}
  #bar{position:absolute;left:0;bottom:0;height:14px;background:#ffb347}
</style>
</head>
<body>
<div id="stage"><div id="bar"></div></div>
<script src="narr.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
const stage=document.getElementById('stage');
const bar=document.getElementById('bar');
const INK='#2b2b2b', ORANGE='#ffb347', PINK='#ff9eb5', BLUE='#8ecdf5', GREEN='#8fd694', YELLOW='#ffe066', RED='#ff5a5f', PURPLE='#c3a6ff', SKIN='#ffe0c2', NAVY='#6f8fd8';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

/* ---------- svg string helpers ---------- */
const ST=`stroke="${INK}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"`;
const path=(d,f='none',x='')=>`<path d="${d}" fill="${f}" ${x} ${ST}/>`;
const circ=(cx,cy,r,f='none',x='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${x} ${ST}/>`;
const rect=(x,y,w,h,f='none',rx=0,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${e} ${ST}/>`;
const line=(x1,y1,x2,y2,e='')=>`<path d="M${x1} ${y1} L${x2} ${y2}" fill="none" ${e} ${ST}/>`;
const dot=(cx,cy,r,f=INK)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="none" data-nd="1"/>`;
const blush=(cx,cy,rx=12,ry=8)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#ff9eb5" opacity=".75" stroke="none" data-nd="1"/>`;
const txt=(x,y,s,str,f=INK,a='middle')=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="900" font-family="'Noto Sans JP'" fill="${f}" text-anchor="${a}" stroke="none" data-nd="1">${str}</text>`;
const arm=(d,c)=>`<path d="${d}" fill="none" stroke="${INK}" stroke-width="26" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round"/>`;

function person(o={}){
  const {shirt=BLUE,hair='#5a4030',glasses=0,tie=0,style='short',arms='down',headOnly=0,badge='',face='smile'}=o;
  let s='';
  if(!headOnly){
    const L=arms==='up'||arms==='cheer'?'M-48 112 Q-92 84 -90 26':arms==='point'?'M-48 112 Q-90 130 -108 118':'M-48 118 Q-84 142 -78 188';
    const R=arms==='up'||arms==='cheer'||arms==='wave'?'M48 112 Q92 84 90 26':arms==='point'?'M48 112 Q90 130 108 118':'M48 118 Q84 142 78 188';
    s+=arm(L,shirt)+arm(R,shirt);
    s+=path('M-58 214 Q-62 84 0 76 Q62 84 58 214 Z',shirt);
    if(tie)s+=path('M-14 80 L0 96 L14 80',  '#fff')+path('M0 96 L-10 112 L0 156 L10 112 Z',RED);
    if(badge)s+=txt(0,160,26,badge,INK);
  }
  s+=circ(0,0,62,SKIN);
  if(style==='short')s+=path('M-64 -4 Q-74 -82 0 -78 Q74 -82 64 -4 Q50 -46 0 -44 Q-50 -46 -64 -4Z',hair);
  if(style==='bob')s+=path('M-70 44 Q-84 -88 0 -82 Q84 -88 70 44 Q60 -28 40 -48 Q0 -34 -40 -48 Q-60 -28 -70 44Z',hair);
  if(style==='bun')s+=circ(0,-84,24,hair)+path('M-64 -4 Q-74 -82 0 -78 Q74 -82 64 -4 Q50 -46 0 -44 Q-50 -46 -64 -4Z',hair);
  if(style==='boss')s+=path('M-62 -10 Q-64 -70 0 -66 Q64 -70 62 -10 Q40 -40 0 -38 Q-40 -40 -62 -10Z',hair);
  s+=dot(-22,8,7)+dot(22,8,7)+blush(-40,28)+blush(40,28);
  if(face==='open')s+=path('M-14 26 Q0 54 14 26 Z','#ff8a8a','stroke-width="5"');
  else s+=path('M-14 28 Q0 42 14 28','none','stroke-width="5"');
  if(glasses)s+=circ(-22,8,18)+circ(22,8,18)+line(-4,8,4,8);
  return s;
}
function desk(cx,y,mon=1){
  let s=rect(cx-92,y,184,18,'#e8c39e',6)+rect(cx-80,y+18,14,84,'#e8c39e',4)+rect(cx+66,y+18,14,84,'#e8c39e',4);
  if(mon)s+=path(`M${cx-12} ${y} L${cx-18} ${y-16} L${cx+18} ${y-16} L${cx+12} ${y}`,'#ddd')+rect(cx-48,y-82,96,66,'#fff',8)+`<rect x="${cx-40}" y="${y-74}" width="80" height="50" rx="4" fill="#bfe6ff" stroke="none" data-nd="1"/>`;
  return s;
}
function house(cx,base,w,h,roof,wall='#fff7ea'){
  const x=cx-w/2;
  return rect(x,base-h,w,h,wall,6)+path(`M${x-14} ${base-h+4} L${cx} ${base-h-w*0.42} L${x+w+14} ${base-h+4} Z`,roof)
   +rect(cx-w*0.14,base-h*0.55,w*0.28,h*0.55,'#c9a27a',4)+rect(x+w*0.1,base-h*0.8,w*0.2,w*0.2,'#bfe6ff',3);
}
function tree(cx,base,s=1){return rect(cx-8*s,base-70*s,16*s,70*s,'#b98b5e',3)+circ(cx,base-100*s,50*s,'#a8e0a0');}
function heart(cx,cy,s,f=PINK){return path(`M${cx} ${cy+40*s} C${cx-90*s} ${cy-10*s} ${cx-45*s} ${cy-70*s} ${cx} ${cy-25*s} C${cx+45*s} ${cy-70*s} ${cx+90*s} ${cy-10*s} ${cx} ${cy+40*s} Z`,f);}
function sparkle(cx,cy,r,f=YELLOW){return path(`M${cx} ${cy-r} Q${cx+r*.2} ${cy-r*.2} ${cx+r} ${cy} Q${cx+r*.2} ${cy+r*.2} ${cx} ${cy+r} Q${cx-r*.2} ${cy+r*.2} ${cx-r} ${cy} Q${cx-r*.2} ${cy-r*.2} ${cx} ${cy-r}Z`,f,'stroke-width="5"');}
function bubble(x,y,w,h,f,tailX,tailDir='down'){
  const r=40;let s=rect(x,y,w,h,f,r);
  if(tailDir==='down')s+=path(`M${tailX-26} ${y+h-2} L${tailX} ${y+h+44} L${tailX+26} ${y+h-2}`,f);
  if(tailDir==='left')s+=path(`M${x+2} ${y+h/2-24} L${x-40} ${y+h/2+6} L${x+2} ${y+h/2+26}`,f);
  return s;
}
function bulb(cx,cy,r=44){
  let s='';for(let i=0;i<7;i++){const a=(-160+i*23)*Math.PI/180;s+=line(cx+Math.cos(a)*(r+16),cy+Math.sin(a)*(r+16),cx+Math.cos(a)*(r+40),cy+Math.sin(a)*(r+40),'stroke-width="5"');}
  return s+circ(cx,cy,r,YELLOW)+rect(cx-18,cy+r-4,36,24,'#ccc',6);
}

/* ---------- scene engine ---------- */
const scenes=[];let cum=0;
function scene(dur){
  const el=document.createElement('div');el.className='scene';
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 1080 1920');el.appendChild(svg);
  stage.insertBefore(el,bar);
  const k=Math.max(1,((window.NARR||[])[scenes.length]+0.9||0)/dur);dur*=k;
  const sc={dur,k,start:cum,el,svg,items:[]};cum+=dur;scenes.push(sc);
  sc.t=(at,y,html,size,color=INK,o={})=>T(sc,at,y,html,size,color,o);
  sc.g=(at,dur,svgStr,o={})=>G(sc,at,dur,svgStr,o);
  return sc;
}
function T(sc,at,y,html,size,color,o){
  const d=document.createElement('div');d.className='t';
  d.style.cssText=`left:${o.x??540}px;top:${y-size*0.65}px;font-size:${size}px;color:${color};`;
  d.innerHTML=html;sc.el.appendChild(d);
  const dur=o.dur??Math.max(.5,[...d.textContent].length*0.075);
  const hs=[...d.querySelectorAll('.h')];
  sc.items.push(ts=>{
    const p=clamp((ts-at)/dur);
    d.style.visibility=ts<at?'hidden':'visible';
    d.style.clipPath=`inset(-30px ${(1-ease(p))*100}% -30px -30px)`;
    const hp=ease(clamp((ts-at-dur*0.7)/0.5));
    hs.forEach(h=>h.style.setProperty('--p',hp));
  });
}
function G(sc,at,dur,svgStr,o){
  const g=document.createElementNS(NS,'g');g.innerHTML=svgStr;sc.svg.appendChild(g);
  const x=o.x||0,y=o.y||0,s=o.s||1,mode=o.mode||'draw',rot=o.rot||0,ph=Math.random()*6;
  const shapes=[...g.querySelectorAll('path,circle,rect,ellipse')].filter(e=>!e.hasAttribute('data-nd'));
  const nds=[...g.querySelectorAll('[data-nd]')];
  const fills=shapes.map(e=>{
    const f=e.getAttribute('fill');return f&&f!=='none'?f:null;});
  if(mode==='draw')shapes.forEach(e=>{e.setAttribute('pathLength','1');e.style.strokeDasharray='1 1';});
  const nops=nds.map(e=>e.getAttribute('opacity')||'1');
  sc.items.push(ts=>{
    const p=clamp((ts-at)/dur);
    let ox=x,oy=y,sc2=s,vis=ts>=at;
    if(o.bob&&p>=1)oy+=Math.sin(ts*3.2+ph)*o.bob;
    if(mode==='pop'){
      const k=back(clamp((ts-at)/dur));sc2=s*Math.max(.001,k);
      g.style.opacity=clamp((ts-at)/(dur*.4));
    }
    g.setAttribute('transform',`translate(${ox},${oy}) rotate(${rot}) scale(${sc2})`);
    g.style.visibility=vis?'visible':'hidden';
    if(mode==='draw'){
      const n=shapes.length;
      shapes.forEach((e,i)=>{
        const st=(i/n)*.7, q=clamp((p-st)/.3);
        e.style.strokeDashoffset=1-q;
        e.style.opacity=q>0?1:0;
        if(fills[i])e.setAttribute('fill-opacity',clamp((q-.55)/.45));
      });
      const f=clamp((p-.85)/.15);nds.forEach((e,i)=>e.setAttribute('opacity',f*nops[i]));
    }else if(mode==='fade'){
      g.style.opacity=ease(p);
    }
  });
}

function render(t){
  scenes.forEach(sc=>{
    const vis=t>=sc.start&&t<sc.start+sc.dur;
    sc.el.style.display=vis?'block':'none';
    if(!vis)return;
    const ts=t-sc.start;
    sc.el.style.opacity=clamp(Math.min(ts/.12,(sc.dur-ts)/.35));
    sc.items.forEach(f=>f(ts/sc.k));
  });
  bar.style.width=(t/cum*1080)+'px';
}

[[150,PINK,'bob'],[330,YELLOW,'bun'],[750,GREEN,'bob'],[930,PURPLE,'short']].forEach(([x,c,st],i)=>{
  sc.g(4.1+i*.35,.5,person({shirt:c,style:st,arms:'wave'}),{x:x,y:1330+(i%2)*40,s:.62,mode:'pop',bob:4});
});
sc.g(4.0,.6,sparkle(130,780,36)+sparkle(950,820,30,PINK)+sparkle(860,540,26,BLUE),{mode:'pop'});
sc.t(4.9,1700,'税理士事務所・開業物語',56,'#888',{dur:.8});

sc.t(1.1,450,'売上ゼロ。',120,RED);
sc.t(1.9,585,'なのに…',100,'#666');
sc.t(2.7,740,'<span class="h">パートを4人採用!</span>',110);
const xs=[150,390,630,870],cols=[PINK,YELLOW,GREEN,PURPLE],sty=['bob','bun','bob','short'];
xs.forEach((x,i)=>sc.g(3.8+i*.35,.5,person({shirt:cols[i],style:sty[i],arms:'wave'}),{x:x,y:990,s:.62,mode:'pop',bob:4}));
xs.forEach((x,i)=>sc.g(3.0+i*.25,.6,desk(x,1090),{}));
sc.t(5.2,1330,'机も4つ。',92);
sc.t(5.9,1450,'パソコンも4台。',92);
